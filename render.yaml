services:
  # ===== FRONTEND (Statische Website) =====
  - type: web
    name: Fidaro-Vastgoed-Frontend
    env: static
    buildCommand: "npm install --legacy-peer-deps && npm run build"
    publishDir: "frontend/build"
    routes:
      - src: "/*"
        dest: "/index.html"

 # ===== BACKEND (Python FastAPI Server) =====
  - type: web
    name: fidaro-backend
    env: python
    buildCommand: "pip install fastapi uvicorn pymongo python-dotenv motor stripe pydantic email-validator || pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3